# ShinyStan -> ShinyApps bundle (deploy-style, mirrors shinystan::deploy_shinystan()).
# Bundles the package's Shiny app (inst/ShinyStan) as a plain ui.R/server.R app:
# prepends library() lines and supplies the demo object via app/sso.RData.
# The shinystan package itself is NOT needed at runtime (S4 slots load from
# sso.RData without the class definition), so no rstan dependency either.
name: Build app bundle

on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to attach bundles to (e.g. v0.3.0)"
        required: false
        type: string

permissions:
  contents: write

env:
  APP_ID: "shinystan"
  APP_NAME: "ShinyStan"
  APP_AUTHOR: "Jonah Gabry, Duco Veen, Stan Development Team"
  APP_DESC: "Interactive visual and numerical diagnostics and posterior analysis for Bayesian models (MCMC) - ShinyStan"
  APP_HOMEPAGE: "https://mc-stan.org/shinystan/"
  APP_LICENSE: "GPL-3.0-or-later"
  APP_SUBDIR: "ShinyStan"
  DEMO_RDA: "data/eight_schools.rda"
  DEMO_OBJECT: "eight_schools"
  UI_LIBS: "shiny,shinyjs,colourpicker,markdown,shinythemes,ggplot2,bayesplot,gtools,reshape2,dygraphs,xts,xtable,gridExtra,DT,threejs"
  SERVER_LIBS: "shiny,shinyjs,colourpicker,markdown,shinythemes"
  APP_NOTES: "ShinyStan packaged as a plain ui.R/server.R app (same technique as shinystan::deploy_shinystan): the app files are bundled, library() lines are prepended, and the built-in eight_schools demo is provided via sso.RData at startup. Load your own MCMC output through the app's normal load/paste workflow. Model fitting is out of scope (ShinyStan visualizes an existing posterior sample)."
  MAX_REQUEST_MB: "1024"
  R_VERSION: "4.6.1"

jobs:
  bundle:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: "win-x64" }
          - { os: macos-14,       platform: "mac-arm64" }
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ env.R_VERSION }}
          use-public-rspm: true

      - name: Install build helpers
        shell: bash
        run: Rscript -e 'install.packages(c("jsonlite","zip","digest","BiocManager"), repos="https://cloud.r-project.org")'

      - name: Resolve store version
        shell: bash
        run: |
          V="${{ github.event.release.tag_name }}${{ github.ref_name }}${{ inputs.tag }}"
          V="${V#v}"
          if [ -z "$V" ]; then V="0.3.0"; fi
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - name: Assemble bundle (app files + rlib/ + manifest.json)
        shell: Rscript {0}
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          app_id <- Sys.getenv("APP_ID")
          sub_   <- Sys.getenv("APP_SUBDIR")
          src    <- normalizePath(file.path(getwd(), "inst", sub_), winslash = "/", mustWork = TRUE)
          bundle <- file.path(getwd(), "bundle"); unlink(bundle, recursive = TRUE); dir.create(bundle, recursive = TRUE)
          appdir <- file.path(bundle, "app"); dir.create(appdir, recursive = TRUE)
          lib    <- file.path(bundle, "rlib"); dir.create(lib, recursive = TRUE)

          # --- 1. copy the Shiny app files verbatim --------------------------
          for (p in list.files(src, all.files = TRUE, no.. = TRUE, full.names = TRUE))
            file.copy(p, appdir, recursive = TRUE)
          if (!file.exists(file.path(appdir, "ui.R")) || !file.exists(file.path(appdir, "server.R")))
            stop("ui.R/server.R missing after copy")

          # --- 2. provide the demo object via sso.RData (like deploy_shinystan)
          e <- new.env(); load(file.path(getwd(), Sys.getenv("DEMO_RDA")), envir = e)
          assign(".SHINYSTAN_OBJECT", get(Sys.getenv("DEMO_OBJECT"), envir = e))
          save(list = ".SHINYSTAN_OBJECT", file = file.path(appdir, "sso.RData"))

          # --- 3. prepend library() lines + load the demo object -------------
          ui_libs  <- strsplit(trimws(Sys.getenv("UI_LIBS")), "[ ,]+")[[1]]
          srv_libs <- strsplit(trimws(Sys.getenv("SERVER_LIBS")), "[ ,]+")[[1]]
          prepend <- function(f, lines) { txt <- readLines(f, warn = FALSE); writeLines(c(lines, txt), f) }
          prepend(file.path(appdir, "ui.R"), paste0("library(", ui_libs, ");"))
          prepend(file.path(appdir, "server.R"), paste0("library(", srv_libs, ");"))
          prepend(file.path(appdir, "global.R"), "load(\"sso.RData\")")

          # --- 4. install the dependency closure -----------------------------
          seed <- unique(c(ui_libs, srv_libs))
          base_pkgs <- rownames(installed.packages(priority = "base"))
          repos <- BiocManager::repositories(); options(repos = repos)
          db <- available.packages(repos = repos)
          closure <- unique(c(seed, unlist(tools::package_dependencies(seed, db = db, recursive = TRUE))))
          closure <- setdiff(closure, base_pkgs); closure <- intersect(closure, rownames(db))
          li <- function(p, type) if (length(p)) install.packages(p, lib = lib, repos = repos, type = type, dependencies = FALSE, Ncpus = 2)
          have <- function() basename(list.dirs(lib, recursive = FALSE))
          li(closure, "binary"); nb <- setdiff(closure, have())
          if (length(nb)) { cat("source fallback:", length(nb), "\n"); li(nb, "source") }
          missing <- setdiff(seed, have()); if (length(missing)) stop("missing: ", paste(missing, collapse = ", "))
          cat("rlib packages:", length(have()), "\n")

          # --- 5. manifest.json (plain ui.R/server.R app) --------------------
          pkgs <- as.data.frame(installed.packages(lib.loc = lib), stringsAsFactors = FALSE)
          man <- list(
            schema = 1L, id = app_id, name = Sys.getenv("APP_NAME"), version = Sys.getenv("VERSION"),
            author = Sys.getenv("APP_AUTHOR"), description = Sys.getenv("APP_DESC"),
            homepage = Sys.getenv("APP_HOMEPAGE"), license = Sys.getenv("APP_LICENSE"),
            runtime = "r-shiny", entry = "app/ui.R", platform = "${{ matrix.platform }}",
            r_version = Sys.getenv("R_VERSION"), min_shell_version = "0.1.0", notes = Sys.getenv("APP_NOTES"),
            packages = lapply(seq_len(nrow(pkgs)), function(i) list(
              name = pkgs$Package[i], version = pkgs$Version[i],
              path = file.path("rlib", pkgs$Package[i]), source = "cran")))
          jsonlite::write_json(man, file.path(bundle, "manifest.json"), pretty = TRUE, auto_unbox = TRUE)

      - name: Zip + sha256
        shell: Rscript {0}
        run: |
          out <- sprintf("%s-%s-%s.zip", Sys.getenv("APP_ID"), Sys.getenv("VERSION"), "${{ matrix.platform }}")
          bundle <- file.path(getwd(), "bundle"); old <- setwd(bundle); on.exit(setwd(old))
          zip::zipr(out, files = list.files(".", all.files = TRUE, no.. = TRUE))
          entries <- utils::unzip(out, list = TRUE)$Name
          if (!any(grepl("^rlib/", entries))) stop("zip is missing rlib/ -- aborting")
          if (!any(grepl("^app/(app[.]R|ui[.]R)$", entries))) stop("zip is missing app/app.R or app/ui.R -- aborting")
          if (!any(grepl("^app/sso[.]RData$", entries))) stop("zip is missing app/sso.RData -- aborting")
          setwd(old); file.rename(file.path(bundle, out), out)
          sha <- digest::digest(out, algo = "sha256", file = TRUE); sz <- file.size(out)
          cat("bundle zip size (bytes):", sz, "\n")
          if (sz > 2 * 1024^3) warning("bundle exceeds the 2 GiB GitHub Release asset limit.")
          writeLines(sprintf('{"platform":"%s","file":"%s","sha256":"%s","size":%d}', "${{ matrix.platform }}", out, sha, sz),
                     sprintf("meta-%s.json", "${{ matrix.platform }}"))

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.platform }}
          path: |
            *.zip
            meta-*.json

  release:
    needs: bundle
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          files: artifacts/*.zip
